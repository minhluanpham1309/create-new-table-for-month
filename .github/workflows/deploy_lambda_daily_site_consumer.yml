name: Deploy Monthly Adding Site Tables Consumer Lambda

on:
  pull_request:
    branches:
      - 'develop'
      - 'main'
    types:
      - closed
    paths:
      - MonthlyAddingSiteTablesConsumer/**

env:
  AWS_REGION: ap-northeast-1
  PYTHON_VERSION: '3.11'
  AWS_ACCOUNT_ID: 683918607581
  GITHUB_OIDC_ROLE: HeatmapJapan-GithubAction
  LAMBDA_FUNCTION_NAME: MonthlyAddingSiteTablesConsumer
  LAMBDA_DIR: MonthlyAddingSiteTablesConsumer

jobs:
  deploy:
    # Run workflow when:
    # - PR merged to develop from feature/* branch, OR
    # - PR merged to main from release/* or hotfix/* branch
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Download RDS SSL Certificate
      run: |
        cd ${{ env.LAMBDA_DIR }}
        mkdir -p certs
        curl -o certs/${{ env.AWS_REGION }}-bundle.pem \
          https://truststore.pki.rds.amazonaws.com/${{ env.AWS_REGION }}/${{ env.AWS_REGION }}-bundle.pem

    - name: Build Lambda package
      run: |
        cd ${{ env.LAMBDA_DIR }}
        mkdir -p build
        
        # Install dependencies
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt -t build/ --upgrade
        fi
        
        # Copy Lambda function and ssl ca
        cp -r *.py build/
        cp -r certs build/

    - name: Create deployment package
      run: |
        cd ${{ env.LAMBDA_DIR }}/build
        zip -r ../deployment-package.zip . -x "*.pyc" -x "*__pycache__*" -x "*.dist-info/*"

    - name: Cleanup downloaded certificate
      run: rm -rf ${{ env.LAMBDA_DIR }}/certs/

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.GITHUB_OIDC_ROLE }}
        role-duration-seconds: 900
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to AWS Lambda
      run: |
        aws lambda update-function-code \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
          --zip-file fileb://${{ env.LAMBDA_DIR }}/deployment-package.zip \
          --publish

    - name: Wait for Lambda update
      run: |
        aws lambda wait function-updated \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME }}
        echo "Consumer Lambda deployment successful!"

    - name: Cleanup build artifacts
      if: always()
      run: |
        rm -rf ${{ env.LAMBDA_DIR }}/build/
        rm -f ${{ env.LAMBDA_DIR }}/deployment-package.zip