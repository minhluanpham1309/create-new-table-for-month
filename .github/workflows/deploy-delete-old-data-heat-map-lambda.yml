name: Deploy Delete Heat Map Cache Lambda

on:
  pull_request:
    branches:
      - 'develop'
      - 'main'
    types:
      - closed
    paths:
      - 'DeleteOldDataHeatMap/**'

jobs:
  deploy-lambda:
    uses: ./.github/workflows/deploy-lambda-reusable.yml
    with:
      lambda-function-name: DeleteOldDataHeatMap
      lambda-dir: DeleteOldDataHeatMap
      aws-account-id: '683918607581'
      github-oidc-role: HeatmapJapan-GithubAction
      deployment-message: 'Delete Old Data Heat Map Lambda deployment successful!'
