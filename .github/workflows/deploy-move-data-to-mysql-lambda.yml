name: Deploy Move data To Mysql Lambda

on:
  pull_request:
    branches:
      - 'develop'
      - 'main'
    types:
      - closed
    paths:
      - 'MoveDataToMysql/**'

jobs:
  deploy-lambda:
    uses: ./.github/workflows/deploy-lambda-reusable.yml
    with:
      lambda-function-name: MoveDataToMysql
      lambda-dir: MoveDataToMysql
      aws-account-id: '683918607581'
      github-oidc-role: HeatmapJapan-GithubAction
      deployment-message: 'Move Data to Mysql Lambda deployment successful!'
